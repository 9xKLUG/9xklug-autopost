# ============================================================
#  9x KLUG Autopost: Einstellungen
#  Hier darfst du alles ändern. Danach speichern und in
#  GitHub Desktop auf "Commit" und "Push" klicken.
#  Wichtig: Die Einrückungen (Leerzeichen) beibehalten!
# ============================================================

# Auf true setzen, um das automatische Posten anzuhalten
pausiert: false

# Ab diesem Tag wird gepostet
aktiv_ab: 2026-10-19

# Wann was gepostet wird (Uhrzeit Berlin). Beliebig viele Zeilen möglich.
# typ ist entweder: reel  oder  karussell  oder  raetsel (Rätsel-Reels ohne Lösung, siehe unten)
# tage (optional): nur an diesen Wochentagen. Ohne tage = jeden Tag.
# plattformen (optional, seit 08.11.2026): wo der Termin läuft, z. B. plattformen: [facebook].
#   Erlaubt: instagram, facebook, youtube. Ohne plattformen = wie bisher überall
#   (Instagram, danach Facebook und YouTube, soweit dort aktiv: true).
#   Gilt auch für die Termine unter extra_termine. Tippfehler = Termin fällt aus + Mail.
# Zeitplan seit 08.11.2026: zwei Posts pro Tag (16:30 und 21:00), nichts vor 16:30.
#   16:30: Mo Fun Fact, Di Welches Jahr, Mi Reihe, Do Schüttelgeschichte (seit 10.11., vorher Was verbindet sie), Fr Wer bin ich,
#          Sa Karussell (Instagram) + Suchsel (nur Facebook), So Reihe.
zeitplan:
  - zeit: "16:30"
    typ: reel
    tage: [Mi]
  - zeit: "16:30"
    typ: reel
    tage: [So]
    plattformen: [facebook]
  - zeit: "16:30"
    typ: karussell
    tage: [Sa]
  - zeit: "21:00"
    typ: raetsel
    tage: [Mo, Di, Mi, Do, Fr, Sa]
  - zeit: "21:00"
    typ: raetsel
    tage: [So]
    plattformen: [facebook]

# Wird ein Termin verpasst (z. B. Störung bei GitHub), wird höchstens
# so viele Stunden später noch nachgeholt. Danach fällt er aus.
max_verspaetung_stunden: 6

# ------------------------------------------------------------
#  KARUSSELLS
# ------------------------------------------------------------
karussell_hashtags: "#rätsel #Denksport #rätselspaß #knobeln #gehirnjogging"

# true = das erste Slide (Cover) wird beim Posten weggelassen,
# das Karussell startet direkt mit dem Rätsel. Deine Dateien bleiben unverändert.
# false = Cover wird wie bisher mitgepostet.
cover_weglassen: true

# Die Rätselarten kommen der Reihe nach dran, egal an welchem Tag.
# Nach der zuletzt geposteten Art kommt einfach die nächste in der Liste.
# (rhythmus_start wird nicht mehr gebraucht, darf aber stehen bleiben)
rhythmus_start: 2026-10-14

# Reihenfolge der Rätselarten.
# name  = wie du sie nennst
# ordner = wie sie im Ordnernamen steht (9x_KLUG_<ordner>_<Datum>)
karussell_rhythmus:
  - name: Zahlenschloss
    ordner: Zahlenschloss
  - name: Quadrate zählen
    ordner: Quadrate_zaehlen
  - name: Minensuche
    ordner: Minensuche
  - name: Buchstabenreihen
    ordner: Buchstabenreihen
  - name: Papierfalten
    ordner: Papier_falten
  - name: Symbol-Gleichungen
    ordner: Symbolraetsel
  - name: Zahnräder
    ordner: Zahnraeder
  - name: Zahlenmauer
    ordner: Zahlenmauer
  - name: Würfelnetz
    ordner: Wuerfelnetz
  - name: Streichhölzer
    ordner: Streichhoelzer
  - name: Zahlenreihen
    ordner: Zahlenreihen
  - name: Würfeltürme
    ordner: Wuerfeltuerme
  - name: "< > Gitter"
    ordner: Groesser_Kleiner
  - name: Gedrehte Figur
    ordner: Gedrehte_Figur

# ------------------------------------------------------------
#  REELS
#  Reihenfolge reihum, nie zwei Tage hintereinander derselbe Typ.
#  ordner = Name des Unterordners im Ordner "reels"
#  Neue Typen einfach unten anhängen.
#
#  Caption eines Reels (seit 01.11.2026):
#    Zeile 1: hook = fester Text des Typs. Er muss für JEDES Reel des Typs stimmen.
#             Liegt neben einem Video eine Textdatei mit genau gleichem Namen
#             (z. B. Video.mp4 + Video.txt), kommt stattdessen deren Text.
#    Zeile 2: ein Satz aus der Gruppe "aufforderung" (Gruppen siehe reel_caption unten).
#             Welcher Satz, hängt fest am Reel: die Vorschau zeigt genau, was rausgeht.
#    Danach:  Schlusssatz und hashtags.
#
#  Titelbild (seit 01.11.2026): titelbild_sekunde = Zeitpunkt im Video, an dem die Aufgabe
#  komplett zu sehen ist, aber noch nichts von der Lösung. Daraus wird das Titelbild geschnitten
#  (oberer Teil des Bildes, damit Logo und Überschrift im Profil-Raster sichtbar sind).
#  Ohne titelbild_sekunde gilt die titelbild.png im Ordner. Klappt es nicht, ebenfalls
#  titelbild.png + Mail. Neuer Typ: Zeitpunkt erst prüfen (Vorschau -> Download "titelbilder").
#  Fehlt hook oder aufforderung, wird nur mit Hashtags gepostet und du bekommst eine Mail.
#  Neuer Typ: ordner, hashtags, hook und aufforderung eintragen.
#
#  youtube_text (seit 03.11.2026) = Beschreibung des Shorts auf YouTube für diesen Typ
#  (darunter kommt der Schlusssatz aus dem Abschnitt youtube). Fehlt er: nur Schlusssatz + Mail.
#
#  facebook_text (seit 07.11.2026) = Text des Reels auf der Facebook-Seite für diesen Typ.
#  Darüber steht die Zeile aus der Textdatei des Reels (falls es eine hat). Keine Hashtags.
#  Mehrere Zeilen: nach "facebook_text: |" jede Zeile gleich weit einrücken, Leerzeile = Absatz.
#  Die Texte sind vorläufig und dürfen jederzeit ersetzt werden (danach Vorschau laufen lassen:
#  status/captions_reels.csv zeigt in der Spalte Facebook-Text genau, was rausgeht).
#
#  caption_datei: true (seit 09.11.2026, Entweder oder + Wissensfragen ohne Auflösung aus dem Reel-Studio):
#  Caption kommt komplett aus der <Video>_Caption.txt (wie bei den Rätsel-Reels ohne Lösung, nur die
#  ersten 5 Hashtags), Facebook = gleicher Text ohne "@9xklug_raetsel"-Zeile, YouTube-Titel = erste Zeile
#  der Caption-Datei, Lösung aus <Video>_Loesung.txt in status/gepostet.csv (Spalte Lösung).
#  hashtags/aufforderung/facebook_text werden dann nicht gebraucht, hook nur als Ersatz-Titel für YouTube.
#  Fehlt die Caption-Datei oder ist sie leer: Reel wird übersprungen + Mail.
#  titelbild_vor_ende = Titelbild so viele Sekunden vor Videoende (statt titelbild_sekunde),
#  titelbild_oben = Pixelzeile, ab der der 3:4-Ausschnitt fürs Profil-Raster beginnt (Standard 0).
# ------------------------------------------------------------
#  Fun Fact läuft seit 31.10.2026 nicht mehr in der Reihe, sondern als fester Termin (seit 08.11.2026 Mo 16:30, siehe extra_termine).
reel_rhythmus:
  - ordner: Entweder oder
    # seit 09.11.2026: nur noch Reels ohne Auflösung (Reel-Studio), Texte aus der Caption-Datei
    caption_datei: true
    hook: "Zwei Antworten, eine stimmt. Welche ist es?"
    titelbild_vor_ende: 0.3
    titelbild_oben: 0
    youtube_text: "Zwei Antworten, eine stimmt. Welche ist es? Schreib deine Antwort in die Kommentare."
  - ordner: Ausreißer
    hashtags: "#rätsel #Denksport #knobeln #gehirnjogging #rätselspaß"
    hook: "Eins passt nicht. Findest du es?"
    aufforderung: suchen
    titelbild_sekunde: 3
    youtube_text: "Eins passt nicht. Hast du es vor der Auflösung gefunden?"
    facebook_text: |
      Einer passt nicht dazu. Finde ihn. 🔍

      Alle sehen gleich aus. Fast alle. Einer tanzt aus der Reihe und hofft, dass du ihn übersiehst.

      Beim „Ausreißer“ zählt nur eins: wie schnell deine Augen sind.

      Na, sofort entdeckt oder bis zum Schluss gesucht? 👇
  - ordner: optische täuschung
    hashtags: "#rätsel #Denksport #knobeln #gehirnjogging #rätselspaß"
    hook: "Trau deinen Augen nicht."
    aufforderung: raten
    titelbild_sekunde: 4
    youtube_text: "Trau deinen Augen nicht. Was hast du zuerst gesehen?"
    facebook_text: |
      Sieht eindeutig aus. Ist es aber nicht. 👀

      Dein Gehirn ist schnell. Sehr schnell. Manchmal leider zu schnell für die Wahrheit.

      Bei den optischen Täuschungen merkst du, wie leicht sich selbst ein kluger Kopf reinlegen lässt.

      Na, durchschaut oder reingefallen? 👇
  - ordner: wahr oder falsch
    hashtags: "#rätsel #Denksport #knobeln #gehirnjogging #unnützeswissen"
    hook: "Wahr oder falsch? Entscheide dich, bevor die Auflösung kommt."
    aufforderung: wissen
    titelbild_sekunde: 3
    youtube_text: "Wahr oder falsch? Die meisten liegen daneben. Wie hast du getippt?"
    facebook_text: |
      Klingt logisch. Muss es aber nicht sein. 🤔

      Eine Aussage. Wahr oder falsch. Wie schwer kann das schon sein?

      Bei „Wahr oder falsch“ zeigt sich, wie viel von deinem Wissen wirklich Wissen ist und wie viel nur gut klingt.

      Na, richtig erkannt oder auf den Leim gegangen? 👇
  - ordner: Wissensfragen
    # seit 09.11.2026: nur noch Reels ohne Auflösung (Reel-Studio), Texte aus der Caption-Datei
    caption_datei: true
    hook: "Wetten, das weißt du nicht?"
    titelbild_vor_ende: 0.3
    titelbild_oben: 65
    youtube_text: "Wetten, das weißt du nicht? Schreib deine Antwort in die Kommentare."

extra_termine:
  - typ: reel
    ordner: Fun Fact
    tage: [Mo]
    zeit: "16:30"
    hashtags: "#rätsel #Denksport #knobeln #gehirnjogging #funfact"
    hook: "Klingt ausgedacht, ist aber wahr."
    aufforderung: wissen
    titelbild_sekunde: 2
    youtube_text: "Klingt ausgedacht, ist aber wahr. Wusstest du das? Ja oder Nein in die Kommentare."
    facebook_text: |
      Klingt ausgedacht. Ist es aber nicht. 🤯

      Manche Fakten hört man einmal und vergisst sie nie wieder. Meistens genau die, die man nie gebraucht hätte.

      Bei „Fun Fact“ gibt's Wissen, nach dem niemand gefragt hat und das man trotzdem sofort weitererzählen will.

      Na, wusstest du's schon oder hast du gerade was gelernt? 👇
  - typ: reel
    ordner: Welches Jahr
    tage: [Di]
    zeit: "16:30"
    hashtags: "#rätsel #Denksport #knobeln #gehirnjogging #rätselspaß"
    hook: "Das alles ist in einem einzigen Jahr passiert. Welches Jahr ist es?"
    aufforderung: raten
    titelbild_sekunde: 5.9
    youtube_text: "Das alles ist in einem einzigen Jahr passiert. Wie nah warst du dran?"
    facebook_text: |
      Ein gesuchtes Jahr. Keine Ahnung? Oder doch? 📅

      Ein paar Hinweise, ein Jahr. Grob schätzen kann jeder. Aufs Jahr genau wird's eng.

      Bei „Welches Jahr?“ zeigt sich, wie gut dein Geschichtsgefühl wirklich ist.

      Na, Volltreffer oder Jahrzehnte daneben? 👇
  - typ: reel
    ordner: Suchsel
    tage: [Sa]
    zeit: "16:30"
    plattformen: [facebook]
    hashtags: "#rätsel #Denksport #knobeln #gehirnjogging #rätselspaß"
    hook: "Findest du alle versteckten Wörter?"
    aufforderung: suchen
    titelbild_sekunde: 5.5
    youtube_text: "Alle gefunden oder eins übersehen? Sei ehrlich."
    facebook_text: |
      Drei Wörter. Ein Buchstabensalat. Los. 🔤

      Die Wörter sind alle da. Sie verstecken sich nur ziemlich gut.

      Beim Suchsel brauchst du kein Wissen, nur gute Augen und ein bisschen Geduld.

      Na, alle drei gefunden oder fehlt noch eins? 👇
  - typ: reel
    ordner: Schuettelgeschichte
    # seit 10.11.2026 statt "Was verbindet sie": Schüttelgeschichte aus dem Reel-Studio, ohne Auflösung.
    # Pro Reel MP4 + _Caption.txt + _Loesung.txt in den Ordner reels/Schuettelgeschichte/ legen.
    tage: [Do]
    zeit: "16:30"
    caption_datei: true
    hook: "Entwirr die Geschichte. Schaffst du es?"
    titelbild_vor_ende: 0.3
    titelbild_oben: 0
    youtube_text: "Entwirr die Geschichte und schreib sie in die Kommentare."
  - typ: reel
    ordner: Logik
    # seit 14.11.2026 statt "Wer bin ich": Logik-Rätsel aus dem Reel-Studio, ohne Auflösung.
    # Pro Reel MP4 + _Caption.txt + _Loesung.txt in den Ordner reels/Logik/ legen (Namen nicht ändern).
    tage: [Fr]
    zeit: "16:30"
    caption_datei: true
    hook: "Nur wenige lösen das. Findest du die Regel?"
    titelbild_vor_ende: 0.3
    titelbild_oben: 70
    youtube_text: "Finde die Regel und schreib deine Lösung (A, B, C oder D) in die Kommentare."

# ------------------------------------------------------------
#  RÄTSEL-REELS OHNE LÖSUNG (seit 07.11.2026)
#  Eigene Reihe, getrennt von den anderen Reels und den Karussells.
#  Wann: Zeile mit typ: raetsel im zeitplan oben (21:00, jeden Tag).
#  Wo:   reels/Ohne Lösung/<Art>/  (Art = Name wie unter rhythmus)
#        Pro Reel: die MP4 und die _Caption.txt aus dem Reel-Studio (Namen nicht ändern).
#        Dazu die Übersicht-CSV aus dem Rätsel-Tool (Uebersicht_B….csv) in den Ordner der Art legen.
#  Caption: Die _Caption.txt wird komplett übernommen (Instagram und Facebook).
#           Es bleiben nur die ersten hashtags_max Hashtags (Instagram erlaubt 5).
#           Fehlt die Datei, ist sie leer oder zu lang: Das Reel wird übersprungen,
#           das nächste derselben Art kommt dran, und du bekommst eine Mail.
#  Facebook: gleicher Text, aber ohne die Zeilen, die etwas aus facebook_zeilen_weglassen enthalten.
#  YouTube: für diese Reihe noch nicht eingerichtet.
#  Lösung: Autopost sucht das Reel in der Übersicht-CSV (über Rätselart, Batch-Kürzel und Nummer,
#          z. B. Zahnraeder_B1107-1404_01) und schreibt die Antwort in gepostet.csv, Spalte Lösung.
#          Wird nirgends gepostet. Nicht gefunden = "nicht gefunden", das Reel geht trotzdem raus.
#  Kontrolle: Vorschau laufen lassen. status/captions_reels.csv zeigt jedes Rätsel-Reel mit Caption,
#             Facebook-Text und gefundener Lösung.
# ------------------------------------------------------------
raetsel_reels:
  ordner: Ohne Lösung
  hashtags_max: 5
  facebook_zeilen_weglassen:
    - "@9xklug_raetsel"
  # Titelbild aus dem Video: Zeitpunkt und Ausschnitt fürs Profil-Raster
  # (titelbild_oben 65 = Rätselbild aus dem Reel-Studio mittig im 3:4-Raster)
  titelbild_sekunde: 1
  titelbild_oben: 65
  # Reihenfolge der Arten (der Reihe nach, dann wieder von vorn).
  # Zum Umsortieren einfach die Zeilen verschieben. Name = Ordnername.
  rhythmus:
    - Buchstabenreihe
    - Gedrehte Figur
    - Minensuche
    - Papierfalten
    - Quadrate zählen
    - Streichhölzer
    - Symbolrätsel
    - Würfelnetz
    - Würfeltürme
    - Zahlenmauer
    - Zahlenreihe
    - Zahlenschloss
    - Zahnräder

# Bausteine für die Reel-Captions (siehe Erklärung oben bei REELS).
# Gruppen dürfen beliebig viele Sätze haben. Neue Gruppe: Namen + Sätze anhängen.
reel_caption:
  schluss: "Täglich neue Rätsel, Denkfallen und verblüffendes Wissen für Erwachsene."
  aufforderungen:
    wissen:
      - "Hast du's gewusst? Ja oder Nein in die Kommentare."
      - "Schick das jemandem, der das garantiert nicht wusste."
    suchen:
      - "Wie lange hast du gebraucht? Ehrlich in die Kommentare."
      - "Schick das jemandem, der länger braucht."
    raten:
      - "Schreib deinen Tipp in die Kommentare, bevor die Auflösung kommt."
      - "Schick das jemandem, der sich für schlau hält."

# ------------------------------------------------------------
#  YOUTUBE SHORTS (seit 03.11.2026)
#  YouTube hängt an Instagram: Jedes Reel, das auf Instagram gepostet wird, geht danach
#  auch zu YouTube. Karussells nie. Ein YouTube-Fehler stoppt nie Instagram.
#  Ausnahme (seit 08.11.2026): Termine mit plattformen ohne youtube (z. B. Suchsel) gehen nicht zu YouTube.
#  Titel = Zeile 1 der Reel-Caption (wie oben), über 100 Zeichen: fester hook.
#  Beschreibung = youtube_text des Typs (siehe oben bei den Reels) + schluss.
# ------------------------------------------------------------
youtube:
  # Erst auf true stellen, wenn Google den Prüfungsantrag genehmigt hat!
  # Vorher wäre jedes Video dauerhaft "gesperrt als privat" und für YouTube verloren.
  aktiv: false
  schluss: "Täglich neue Rätsel, Denkfallen und verblüffendes Wissen für Erwachsene. Abonnier 9x KLUG, wenn dein Kopf mehr will."
  # Kategorie: 24 = Unterhaltung, 27 = Bildung
  kategorie: 24
  sprache: de
  # public = öffentlich (nach der Genehmigung). Andere Werte: unlisted, private
  sichtbarkeit: public
  # false = "Nein, nicht speziell für Kinder" (Kanal richtet sich an Erwachsene)
  fuer_kinder: false
  # KI-Kennzeichnung (nur nötig bei realistisch wirkenden Personen/Stimmen, nicht bei Instrumentalmusik)
  ki_inhalt: false
  abonnenten_benachrichtigen: true
  # Zusatzzeilen in der Beschreibung (bewusst aus)
  hashtags_anhaengen: false
  impressum_zeile: false
  impressum_url: "https://9xklug.github.io"

# ------------------------------------------------------------
#  FACEBOOK-SEITE 9x KLUG (seit 07.11.2026)
#  Facebook hängt an Instagram: Jedes Reel, das auf Instagram gepostet wird, geht im selben
#  Lauf auch als Reel auf die Facebook-Seite. Karussells nie. Ein Facebook-Fehler stoppt nie Instagram.
#  Ausnahme (seit 08.11.2026): Termine mit plattformen (z. B. Suchsel: plattformen: [facebook])
#  laufen nur dort, wo es in der Liste steht.
#  Text = Zeile aus der Textdatei des Reels (falls vorhanden) + facebook_text des Typs (siehe oben bei den Reels).
#  Schlüssel und Seiten-Nummer stehen als GitHub-Secrets FB_PAGE_TOKEN und FB_PAGE_ID.
# ------------------------------------------------------------
facebook:
  # true = Reels gehen automatisch auch auf Facebook. false = aus (Instagram läuft normal weiter).
  # Erst auf true stellen, wenn test-facebook geklappt hat.
  aktiv: true
  # Version der Facebook-Schnittstelle (nur ändern, wenn Facebook eine alte Version abschaltet)
  api_version: "v25.0"
